name: HCI crew_assist

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install -r hci/crew_assist/requirements-dev.txt

      - name: Routine HCI check
        run: ./hci/check.sh

  compose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f hci/docker/compose.yml config >/tmp/hci-compose.resolved.yml
