# One-command Astrobee sim + crew assist + browser viewing.
# From the repo:  ./hci/up.sh
# NASA flight sources are not mounted and are not rebuilt.

name: astrobee-hci

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: astrobee-hci:latest
    hostname: sim
    init: true
    stop_grace_period: 25s
    command: ["sim"]
    shm_size: "2gb"
    environment:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: 127.0.0.1
      HCI_NAV_CAM_RATE: ${HCI_NAV_CAM_RATE:-2.0}
      HCI_GUI: ${HCI_GUI:-0}
      HCI_LOG_DIR: /hci/logs
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "6080:6080"
      - "9090:9090"
      - "8080:8080"
      - "8088:8088"
    volumes:
      - ../logs:/hci/logs
      - ../docker:/opt/hci/docker:ro
    healthcheck:
      test: ["CMD", "/opt/hci/docker/scripts/healthcheck.sh"]
      interval: 15s
      timeout: 20s
      retries: 60
      start_period: 90s

  crew:
    image: astrobee-hci:latest
    # Share the sim network namespace. ROS 1 then uses 127.0.0.1, which works
    # on Docker Desktop and does not depend on bridge hairpin routing.
    network_mode: service:sim
    init: true
    stop_grace_period: 25s
    command: ["crew"]
    depends_on:
      sim:
        condition: service_healthy
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: 127.0.0.1
      HCI_LOG_DIR: /hci/logs
      PYTHONDONTWRITEBYTECODE: "1"
      HCI_IMAGE_DIR: /hci/logs/images
    volumes:
      - ../logs:/hci/logs
      - ../docker:/opt/hci/docker:ro
      - ../crew_assist:/opt/hci/crew_assist:ro
